<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 262" width="100%" role="img" aria-label="Flux de création d&#x27;un ticket : préparation, approbation humaine, appel MCP, idempotence" font-family="Inter, DejaVu Sans, sans-serif"><defs><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2430"/></marker><marker id="amt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6675"/></marker></defs><rect x="8" y="52" width="108" height="74" rx="8" fill="#ffffff" stroke="#5b6675" stroke-width="1.3"/><text x="62.0" y="80.5" font-size="11.5" font-weight="700" fill="#1b2430" text-anchor="middle" >Demande</text><text x="62.0" y="95.5" font-size="9.4" font-weight="400" fill="#5b6675" text-anchor="middle" >l&#x27;utilisateur</text><text x="62.0" y="108.0" font-size="9.4" font-weight="400" fill="#5b6675" text-anchor="middle" >veut un ticket</text><rect x="146" y="52" width="140" height="74" rx="8" fill="#e6eef7" stroke="#0f4c81" stroke-width="1.3"/><text x="216.0" y="74.25" font-size="11.5" font-weight="700" fill="#1b2430" text-anchor="middle" >Brouillon</text><text x="216.0" y="89.25" font-size="9.4" font-weight="400" fill="#5b6675" text-anchor="middle" >ticket_draft_v1</text><text x="216.0" y="101.75" font-size="9.4" font-weight="400" fill="#5b6675" text-anchor="middle" >equipment_id, titre,</text><text x="216.0" y="114.25" font-size="9.4" font-weight="400" fill="#5b6675" text-anchor="middle" >description (Pydantic)</text><rect x="316" y="52" width="150" height="74" rx="8" fill="#fdf1e0" stroke="#b45309" stroke-width="1.3"/><text x="391.0" y="80.5" font-size="11.5" font-weight="700" fill="#1b2430" text-anchor="middle" >Aperçu et approbation</text><text x="391.0" y="95.5" font-size="9.4" font-weight="400" fill="#5b6675" text-anchor="middle" >contenu exact affiché</text><text x="391.0" y="108.0" font-size="9.4" font-weight="400" fill="#5b6675" text-anchor="middle" >approuver ou refuser</text><rect x="496" y="52" width="135" height="74" rx="8" fill="#e6eef7" stroke="#0f4c81" stroke-width="1.3"/><text x="563.5" y="74.25" font-size="11.5" font-weight="700" fill="#1b2430" text-anchor="middle" >Jeton d&#x27;approbation</text><text x="563.5" y="89.25" font-size="9.4" font-weight="400" fill="#5b6675" text-anchor="middle" >lié à l&#x27;utilisateur, à</text><text x="563.5" y="101.75" font-size="9.4" font-weight="400" fill="#5b6675" text-anchor="middle" >l&#x27;empreinte du contenu</text><text x="563.5" y="114.25" font-size="9.4" font-weight="400" fill="#5b6675" text-anchor="middle" >et à une durée courte</text><rect x="661" y="52" width="132" height="74" rx="8" fill="#e1f1f0" stroke="#17787a" stroke-width="1.3"/><text x="727.0" y="80.5" font-size="11.5" font-weight="700" fill="#1b2430" text-anchor="middle" >create_ticket</text><text x="727.0" y="95.5" font-size="9.4" font-weight="400" fill="#5b6675" text-anchor="middle" >appel MCP avec jeton</text><text x="727.0" y="108.0" font-size="9.4" font-weight="400" fill="#5b6675" text-anchor="middle" >et clé d&#x27;idempotence</text><line x1="116" y1="89" x2="146" y2="89" stroke="#1b2430" stroke-width="1.4" marker-end="url(#art)"/><line x1="286" y1="89" x2="316" y2="89" stroke="#1b2430" stroke-width="1.4" marker-end="url(#art)"/><line x1="466" y1="89" x2="496" y2="89" stroke="#1b2430" stroke-width="1.4" marker-end="url(#art)"/><line x1="631" y1="89" x2="661" y2="89" stroke="#1b2430" stroke-width="1.4" marker-end="url(#art)"/><circle cx="466" cy="52" r="9.5" fill="#b45309" stroke="#ffffff" stroke-width="1.5"/><text x="466" y="55.6" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><path d="M 560 52 L 560 22 L 391 22 L 391 52" fill="none" stroke="#5b6675" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#amt)"/><text x="476" y="15" font-size="8.8" font-weight="400" fill="#5b6675" text-anchor="middle" >contenu modifié : nouvelle empreinte, nouvelle approbation</text><line x1="391" y1="126" x2="391" y2="160" stroke="#1b2430" stroke-width="1.4" marker-end="url(#art)"/><rect x="316" y="160" width="150" height="56" rx="8" fill="#ffffff" stroke="#5b6675" stroke-width="1.3"/><text x="391.0" y="179.5" font-size="11.5" font-weight="700" fill="#1b2430" text-anchor="middle" >Refus</text><text x="391.0" y="194.5" font-size="9.4" font-weight="400" fill="#5b6675" text-anchor="middle" >brouillon abandonné,</text><text x="391.0" y="207.0" font-size="9.4" font-weight="400" fill="#5b6675" text-anchor="middle" >aucun appel MCP</text><line x1="727" y1="126" x2="727" y2="160" stroke="#1b2430" stroke-width="1.4" marker-end="url(#art)"/><rect x="500" y="160" width="293" height="92" rx="8" fill="#eef0f3" stroke="#5b6675" stroke-width="1.3"/><text x="646.5" y="178.75" font-size="10.5" font-weight="700" fill="#1b2430" text-anchor="middle" >Serveur MCP : contrôles à chaque appel</text><text x="646.5" y="193.75" font-size="9" font-weight="400" fill="#5b6675" text-anchor="middle" >1. utilisateur autorisé sur l&#x27;équipement</text><text x="646.5" y="206.25" font-size="9" font-weight="400" fill="#5b6675" text-anchor="middle" >2. jeton valide et non expiré</text><text x="646.5" y="218.75" font-size="9" font-weight="400" fill="#5b6675" text-anchor="middle" >3. empreinte du jeton = contenu reçu</text><text x="646.5" y="231.25" font-size="9" font-weight="400" fill="#5b6675" text-anchor="middle" >4. clé d&#x27;idempotence jamais vue : ticket créé,</text><text x="646.5" y="243.75" font-size="9" font-weight="400" fill="#5b6675" text-anchor="middle" >    sinon renvoi du ticket déjà créé</text><circle cx="500" cy="160" r="9.5" fill="#b45309" stroke="#ffffff" stroke-width="1.5"/><text x="500" y="163.6" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">3</text></svg>